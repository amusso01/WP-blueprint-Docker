x-wordpress-environment: &wordpress-environment
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
  WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
  WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_AUTH: "false"
  SMTP_FROM: wordpress@local.${PROJECT_NAME:-my-project}.dev
  PROJECT_NAME: ${PROJECT_NAME:-my-project}

x-wordpress-volumes: &wordpress-volumes
  - wordpress_data:/var/www/html
  - ./wp-content/themes:/var/www/html/wp-content/themes
  - ./wp-content/plugins:/var/www/html/wp-content/plugins
  - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
  - ./wp-content/uploads:/var/www/html/wp-content/uploads
  - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
  - ./config/mail.ini:/usr/local/etc/php/conf.d/mail.ini:ro
  - ./wordpress/wp-config.php:/var/www/html/wp-config.php

services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:alpine
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data

  wordpress:
    image: wp-blueprint-wordpress:local
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
    restart: unless-stopped
    environment:
      <<: *wordpress-environment
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./config/mail.ini:/usr/local/etc/php/conf.d/mail.ini:ro
      - ./config/https-forward.conf:/etc/apache2/conf-enabled/https-forward.conf:ro
      - ./wordpress/wp-config.php:/var/www/html/wp-config.php
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    labels:
      caddy: local.${PROJECT_NAME:-my-project}.dev
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.tls: internal

  db:
    image: mysql:8.0.32
    pull_policy: missing
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backups:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    pull_policy: missing
    restart: unless-stopped
    expose:
      - "1025"
      - "8025"
    labels:
      caddy: mail.local.${PROJECT_NAME:-my-project}.dev
      caddy.reverse_proxy: "{{upstreams 8025}}"
      caddy.tls: internal

  wpcli:
    image: wp-blueprint-wpcli:local
    build:
      context: .
      dockerfile: docker/wpcli/Dockerfile
    profiles: ["cli"]
    user: "33:33"
    working_dir: /var/www/html
    environment:
      <<: *wordpress-environment
      HOME: /tmp
    volumes: *wordpress-volumes
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
      mailpit:
        condition: service_started
    stdin_open: true
    tty: true

volumes:
  wordpress_data:
  db_data:
  caddy_data:
    name: wp-caddy-data
